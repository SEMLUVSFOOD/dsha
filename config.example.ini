# DSHA configuration file
# =======================
#
# Copy this file to your SD card as:   /dsha/config.ini
#
# Lines starting with # are comments. Only "host" and "token" are required.
# See docs/configuration.md for the full reference.

# --- Home Assistant server (required) ---------------------------------------

# IP address of your Home Assistant server on your local network. Use the IP
# address, not "homeassistant.local" (the DS can't resolve .local names).
# HTTPS is not supported: use the plain http:// local address.
host = 192.168.1.10

# Port of Home Assistant (8123 by default). You can also write it in the host
# line, like "host = http://192.168.1.10:8123".
port = 8123

# Long-lived access token. Create one in Home Assistant: click your user name
# (bottom left) > Security > Long-lived access tokens > Create token.
# Tip: type it on a computer, a DS keyboard is no fun for 180 characters.
token = PASTE_YOUR_LONG_LIVED_ACCESS_TOKEN_HERE

# --- WiFi (optional) ---------------------------------------------------------

# By default DSHA uses the connections saved in the console's WiFi settings
# (set them up from any game with Nintendo WFC settings, or from the DSi
# System Settings). Fill these in to use a different network.
#
# DS / DS Lite / 3DS: only open or WEP networks work.
# DSi (running DSHA in DSi mode): WPA2 works too.
#wifi_ssid = MyNetwork
#wifi_password = MyPassword

# --- Dashboard (optional) ----------------------------------------------------

# Text in the top bar
title = My Home

# Refresh the visible entities every N seconds (0 = only when pressing Y)
refresh_seconds = 15

# Entities to show, in this order. If you don't add any "entity" line, DSHA
# shows every supported entity (up to 128), grouped by type. Picking your
# favourite entities makes loading much faster on big installations.
#entity = light.living_room
#entity = light.kitchen
#entity = switch.coffee_machine
#entity = climate.thermostat
#entity = cover.garage_door
#entity = lock.front_door
#entity = media_player.kitchen_speaker
#entity = scene.movie_night
#entity = sensor.outside_temperature

# In automatic mode (no "entity" lines), only show these domains:
#domains = light, switch, climate, cover, lock, scene, sensor

# Offline demo with fake entities, no WiFi or server needed
#demo = 1
