name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Desktop tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit and network tests
        run: make -C tests test

  build:
    name: Build dsha.nds
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.25.0
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: dsha
          path: |
            dsha.nds
            config.example.ini
            licenses/
            LICENSE
            README.md

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsha
          path: dsha
      - name: Package
        run: |
          cd dsha
          zip -r ../dsha-${GITHUB_REF_NAME}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dsha/dsha.nds
            dsha/config.example.ini
            dsha-${{ github.ref_name }}.zip
          generate_release_notes: true
