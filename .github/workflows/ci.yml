name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Mbed TLS 3.6 (Ubuntu only has 2.28)
        run: sh tests/get_mbedtls.sh
      - name: Run unit and network tests (HTTP and HTTPS)
        run: make -C tests test

  integration:
    name: Home Assistant integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Home Assistant test harness
        run: |
          pip install pytest-homeassistant-custom-component
          pip install "$(python -c 'import json,os,homeassistant.components.frontend as f; print(json.load(open(os.path.join(os.path.dirname(f.__file__), "manifest.json")))["requirements"][0])')"
      - name: Run tests
        run: make test-integration

  panel:
    name: DS Dashboard panel (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install Playwright
        run: |
          cd tests/panel
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run test
        run: make test-panel

  hassfest:
    name: Validate integration (hassfest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    name: Validate HACS repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Repository settings (topics, description, brand icons) are checked too;
    # don't block the build on them.
    continue-on-error: true
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          ignore: brands

  build:
    name: Build dsha.nds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: skylyrac/blocksds:slim-v1.25.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Mbed TLS for BlocksDS
        run: wf-pacman -Sy --noconfirm blocksds-mbedtls
      - name: Build
        run: make
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsha
          path: |
            dsha.nds
            config.example.ini
            licenses/
            LICENSE
            README.md
            CHANGELOG.md

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, integration, panel, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dsha
          path: dsha
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - name: Check the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          grep -q "DSHA_VERSION \"$version\"" src/source/core/app.h || {
            echo "::error::$TAG doesn't match DSHA_VERSION in source/core/app.h"; exit 1; }
          grep -q "\"version\": \"$version\"" src/custom_components/dsha/manifest.json || {
            echo "::error::$TAG doesn't match the version in manifest.json"; exit 1; }
          grep -q "^## $version " src/CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
            found' src/CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ---

          **Downloads**

          - `dsha.nds`: the DS app. Copy it to your SD card (see the README).
          - `dsha-ha-integration-*.zip`: the optional Home Assistant
            integration (DS Dashboard panel). Easier: install it with HACS.
          - `dsha-*.zip`: the app with the example config, licenses and docs.
          EOF
      - name: Package
        run: |
          cd dsha
          zip -r "../dsha-${GITHUB_REF_NAME}.zip" .
          cd ../src/custom_components
          zip -r "../../dsha-ha-integration-${GITHUB_REF_NAME}.zip" dsha
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "DSHA $TAG" --notes-file notes.md \
            dsha/dsha.nds dsha/config.example.ini \
            "dsha-$TAG.zip" "dsha-ha-integration-$TAG.zip"
